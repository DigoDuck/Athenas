# Use mode: always on, 127.0.0.1 only, data apart from dev (spec 5.1).
# Start through `make use-up`, which only runs from a tagged version.
name: athenas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.use
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: use
    restart: unless-stopped
    env_file: .env.use
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2"
    environment:
      BACKUP_DIR: /backup
    # Staging folder on C: only: a G: bind fails silently (D-019). scripts/backup.py copies it to
    # the vault from Windows.
    volumes:
      - ${BACKUP_STAGING:?set BACKUP_STAGING in .env.use}:/backup
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      target: use
    restart: unless-stopped
    ports:
      - "127.0.0.1:8470:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
