# Template: the nginx image fills PORT and BACKEND_URL from the environment at start.
server {
  listen ${PORT};
  root /usr/share/nginx/html;

  # Look the backend up again every 10 s: its address changes when it restarts or redeploys,
  # and a name resolved once at start would answer 502 until nginx restarts too.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  location /api/ {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
