# Template: the nginx image fills PORT and BACKEND_URL from the environment at start.
server {
  listen ${PORT};
  root /usr/share/nginx/html;

  # Look the backend up again every 10 s: its address changes when it restarts or redeploys,
  # and a name resolved once at start would answer 502 until nginx restarts too.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # The API, the admin and the admin's CSS and JS all live in Django.
  location ~ ^/(api|admin|static)/ {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    # $http_host keeps the port: CSRF compares the Origin, port included, with this host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    try_files $uri /index.html;
  }
}
